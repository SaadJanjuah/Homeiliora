# =====================================================================
#  homeiliora — standalone Apache config for local development
#
#  Serves the site at http://localhost:8080 using Laragon's Apache and
#  PHP binaries WITHOUT touching Laragon's own configuration. Laragon's
#  httpd.conf is stock and only gets its settings injected when the
#  Laragon GUI starts, so Apache launched on its own would otherwise load
#  neither mod_php nor any vhost.
#
#  Start it with dev/start-local.ps1, or by hand:
#     httpd.exe -f "C:/Saad VIBE Coding/dev/apache-homeiliora.conf"
#
#  MOVING MACHINES? Only the three Define lines below should need
#  changing — check the Laragon version numbers in the paths, since they
#  change when Laragon updates its bundled Apache or PHP.
# =====================================================================

Define SRVROOT   "C:/laragon/bin/apache/httpd-2.4.66-260223-Win64-VS18"
Define PHPROOT   "C:/laragon/bin/php/php-8.3.30-Win32-vs16-x64"
Define PROJECT   "C:/Saad VIBE Coding"

Define SITEROOT  "${PROJECT}/saad-site"
Define LOGDIR    "${PROJECT}/dev/logs"

ServerRoot "${SRVROOT}"
ServerName localhost:8080
Listen 8080

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule log_config_module modules/mod_log_config.so

# PHP 8.3 as an Apache module (the same wiring Laragon uses)
LoadFile "${PHPROOT}/libcrypto-3-x64.dll"
LoadFile "${PHPROOT}/libssl-3-x64.dll"
LoadModule php_module "${PHPROOT}/php8apache2_4.dll"
PHPIniDir "${PHPROOT}"
AddType application/x-httpd-php .php

TypesConfig conf/mime.types
DirectoryIndex index.php index.html

DocumentRoot "${SITEROOT}"

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "${SITEROOT}">
    Options FollowSymLinks

    # None, deliberately. The site's .htaccess holds only LiteSpeed and
    # ShortPixel directives and no WordPress block; loading it would switch
    # mod_rewrite on for this directory and discard the permalink rules
    # below, which is what made every URL except the homepage 404.
    AllowOverride None
    Require all granted

    # WordPress pretty permalinks. Kept here rather than written into
    # .htaccess so the site's own .htaccess stays untouched.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </IfModule>
</Directory>

# Never serve secrets, even by accident
<FilesMatch "^(wp-config\.php|\.htaccess|.*\.(sql|log|ini))$">
    Require all denied
</FilesMatch>

ErrorLog  "${LOGDIR}/apache-error.log"
CustomLog "${LOGDIR}/apache-access.log" common
LogLevel warn

PidFile "${LOGDIR}/httpd.pid"
