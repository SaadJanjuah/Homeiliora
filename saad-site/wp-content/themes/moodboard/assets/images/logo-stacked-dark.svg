<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
  <!--
    Dark-mode variant of logo-stacked.svg. Same geometry — only the inks are
    lifted for a charcoal ground: charcoal #26241F becomes warm off-white,
    and terracotta/forest match the dark palette in dark.css. Keep the two
    files in step if the mark is ever redrawn.
  -->

  <!-- icon, centered -->
  <g transform="translate(120, 20)">
    <path d="M 20 95 L 80 30 L 140 95"
          fill="none" stroke="#EDE9E2" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="28" r="10" fill="#E4764C"/>
    <line x1="8" y1="122" x2="152" y2="122"
          stroke="#86A98A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- wordmark, centered -->
  <text x="200" y="240" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif"
        font-weight="700" font-size="46" letter-spacing="-0.5">
    <tspan fill="#EDE9E2">home</tspan><tspan fill="#E4764C">iliora</tspan>
  </text>

  <!-- baseline rule -->
  <line x1="90" y1="256" x2="310" y2="256"
        stroke="#86A98A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- pin accent -->
  <rect x="296" y="234" width="11" height="11" fill="#E4764C"
        transform="rotate(45 301.5 239.5)"/>
</svg>
