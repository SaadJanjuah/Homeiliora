<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="homeiliora">
  <!--
    Compact brand mark, for small round contexts: the byline avatar (30px),
    the Get Inspired badge, and the browser favicon.

    A reduction of the header lockup's mark, not a different logo. The full
    version has three wandering vines, twelve leaves in four shapes and three
    blossoms; none of that survives below about 40px, so this keeps the house,
    two short vine stubs, three leaves and one blossom — the same silhouette
    idea at a size where it still reads.

    Literal hex rather than custom properties: this is loaded through <img>,
    which is an isolated document and cannot see the page's CSS variables.
    If the palette changes, these change with it.
      ink #24272A · green #4F6B57 · deep green #334A38 · brass #C9A860
  -->
  <circle cx="60" cy="60" r="59" fill="#F1F2F0" stroke="#CFD3CE" stroke-width="2"/>

  <!-- vines first, so the house sits over them -->
  <g fill="none" stroke-linecap="round">
    <path d="M 41 88 C 37 96 42 102 38 110" stroke="#334A38" stroke-width="3.2"/>
    <path d="M 79 88 C 83 95 78 101 82 108" stroke="#4F6B57" stroke-width="3"/>
  </g>
  <!-- leaves: heart shapes, drooping, different sizes -->
  <path d="M 0 0 C 2.2 -4.4 7.7 -7.2 14.3 -4.4 C 10.5 1.1 3.9 3.9 0 0 Z" fill="#4F6B57" transform="translate(35,96) rotate(203)"/>
  <path d="M 0 0 C 2.2 -4.4 7.7 -7.2 14.3 -4.4 C 10.5 1.1 3.9 3.9 0 0 Z" fill="#334A38" transform="translate(85,97) rotate(-22)"/>
  <path d="M 0 0 C 1.8 -3.5 6.2 -5.8 11.4 -3.5 C 8.4 0.9 3.1 3.1 0 0 Z" fill="#334A38" transform="translate(43,107) rotate(-28)"/>
  <!-- one blossom, brass -->
  <g transform="translate(78,100) scale(0.62)">
    <g fill="#C9A860">
      <ellipse cx="0" cy="-6.4" rx="3.6" ry="5.4"/>
      <ellipse cx="0" cy="-6.4" rx="3.6" ry="5.4" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6.4" rx="3.6" ry="5.4" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6.4" rx="3.6" ry="5.4" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6.4" rx="3.6" ry="5.4" transform="rotate(288)"/>
    </g>
    <circle r="2.7" fill="#7E6429"/>
  </g>

  <path d="M 34 78 L 60 42 L 86 78" fill="none" stroke="#24272A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="41" r="6.5" fill="#C9A860"/>
  <line x1="30" y1="88" x2="90" y2="88" stroke="#24272A" stroke-width="4" stroke-linecap="round"/>
</svg>
