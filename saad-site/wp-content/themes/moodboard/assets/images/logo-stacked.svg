  <!--
    Square brand mark — the full lockup's foliage, for social avatars, Pinterest
    profile art, and og:image use. Text is deliberately omitted: an SVG loaded
    through <img> cannot reach the site's @font-face rules, so a wordmark here
    would silently fall back to Arial rather than Space Grotesk.

    Literal hex, for the same isolated-document reason. Keep in step with the
    palette: ink #24272A · green #4F6B57 · deep green #334A38 · brass #C9A860
  -->
